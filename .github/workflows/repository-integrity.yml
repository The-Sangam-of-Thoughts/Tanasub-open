name: Repository integrity

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-content:
    name: Validate content-only repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Reject executable files, symlinks, submodules, and unexpected file types
        shell: bash
        run: |
          set -euo pipefail
          failed=0

          while IFS= read -r path; do
            mode="$(git ls-files -s -- "$path" | awk '{print $1}')"
            case "$mode" in
              100644) ;;
              *) echo "Blocked Git mode $mode: $path"; failed=1 ;;
            esac

            case "$path" in
              .gitignore|LICENSE|.github/CODEOWNERS|*.md|*.json|*.csv|*.txt|external/fabric-humanize/LICENSE|external/humanizer/LICENSE|.github/workflows/repository-integrity.yml) ;;
              *) echo "Blocked file type or path: $path"; failed=1 ;;
            esac
          done < <(git ls-files)

          exit "$failed"
